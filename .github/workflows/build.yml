name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android (armeabi-v7a)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config build-essential \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake autoconf-archive

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Cache Buildozer global (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Build debug APK
        run: |
          set +e
          # 用 echo y 喂入 SDK 许可确认（CI 上无人值守的兜底）
          OUT=$(echo y | buildozer android debug 2>&1)
          RC=$?
          echo "$OUT"
          if [ $RC -eq 0 ]; then exit 0; fi

          # 非 aidl 报错：原样退出，让 CI 报错显示真实问题
          if ! echo "$OUT" | grep -q "aidl not found"; then exit $RC; fi

          echo ">>> aidl missing, installing build-tools via sdkmanager..."
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager -type f -executable | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo ">>> sdkmanager not found"; exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;33.0.2" > /dev/null 2>&1 || true
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
